<title>Saphi App Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Color+Emoji&display=swap">
<style>
/* Layout: one phone-width column; glass panes (header chip, tools, stats, nav, sheets) float over a soft dappled-light ground. */
:root {
  --paper: #F8FAF6; --paper-2: #EEF3EC; --ink: #1B2620; --ink-2: #4F5E54; --ink-3: #65726A;
  --forest: #1F4A34; --forest-ink: #F4F8F3; --leaf: #3D7A4E; --soil: #7B5236;
  --plant-fill: .24; --pot: #B4643E; --pot-soil: rgba(92,62,44,.30); --bed: #F1E9DE; --bed-edge: rgba(123,82,54,.28); --bed-line: rgba(123,82,54,.10); --bed-major: rgba(123,82,54,.26);
  --glass: rgba(255,255,255,.58); --glass-strong: rgba(255,255,255,.84); --glass-edge: rgba(255,255,255,.9);
  --line: rgba(27,38,32,.09); --shadow: 0 12px 32px -14px rgba(31,74,52,.32);
  --warn: #9A600E; --crit: #A3402B; --good: #2F7A45; --warn-bg: rgba(154,96,14,.10); --crit-bg: rgba(163,64,43,.10); --good-bg: rgba(47,122,69,.10);
  --blob1: rgba(61,122,78,.20); --blob2: rgba(123,82,54,.14); --scrim: rgba(20,30,24,.30);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r-lg: 22px; --r-md: 16px; --r-sm: 12px;
  --ease: cubic-bezier(.16,1,.3,1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0B1310; --paper-2: #111B16; --ink: #E6EEE8; --ink-2: #B3C2B8; --ink-3: #A0AEA4;
    --forest: #A9DBBB; --forest-ink: #0B1310; --leaf: #86C79A; --soil: #CDB49B;
    --plant-fill: .34; --pot: rgba(214,226,218,.62); --pot-soil: rgba(214,226,218,.07); --bed: #121B16; --bed-edge: rgba(169,219,187,.24); --bed-line: rgba(169,219,187,.05); --bed-major: rgba(169,219,187,.13);
    --glass: rgba(17,27,22,.62); --glass-strong: rgba(18,29,24,.94); --glass-edge: rgba(255,255,255,.07);
    --line: rgba(228,236,229,.10); --shadow: 0 14px 34px -14px rgba(0,0,0,.7);
    --warn: #E5AE52; --crit: #EE927C; --good: #82CC98; --warn-bg: rgba(229,174,82,.12); --crit-bg: rgba(238,146,124,.12); --good-bg: rgba(130,204,152,.12);
    --blob1: rgba(134,199,154,.09); --blob2: rgba(120,160,200,.07); --scrim: rgba(0,0,0,.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"], :root[data-mode="night"] {
  --paper: #0B1310; --paper-2: #111B16; --ink: #E6EEE8; --ink-2: #B3C2B8; --ink-3: #A0AEA4;
  --forest: #A9DBBB; --forest-ink: #0B1310; --leaf: #86C79A; --soil: #CDB49B;
  --plant-fill: .34; --pot: rgba(214,226,218,.62); --pot-soil: rgba(214,226,218,.07); --bed: #121B16; --bed-edge: rgba(169,219,187,.24); --bed-line: rgba(169,219,187,.05); --bed-major: rgba(169,219,187,.13);
  --glass: rgba(17,27,22,.62); --glass-strong: rgba(18,29,24,.94); --glass-edge: rgba(255,255,255,.07);
  --line: rgba(228,236,229,.10); --shadow: 0 14px 34px -14px rgba(0,0,0,.7);
  --warn: #E5AE52; --crit: #EE927C; --good: #82CC98; --warn-bg: rgba(229,174,82,.12); --crit-bg: rgba(238,146,124,.12); --good-bg: rgba(130,204,152,.12);
  --blob1: rgba(134,199,154,.09); --blob2: rgba(120,160,200,.07); --scrim: rgba(0,0,0,.5);
  color-scheme: dark;
}
:root[data-mode="day"] {
  --paper: #F8FAF6; --paper-2: #EEF3EC; --ink: #1B2620; --ink-2: #4F5E54; --ink-3: #65726A;
  --forest: #1F4A34; --forest-ink: #F4F8F3; --leaf: #3D7A4E; --soil: #7B5236;
  --plant-fill: .24; --pot: #B4643E; --pot-soil: rgba(92,62,44,.30); --bed: #F1E9DE; --bed-edge: rgba(123,82,54,.28); --bed-line: rgba(123,82,54,.10); --bed-major: rgba(123,82,54,.26);
  --glass: rgba(255,255,255,.58); --glass-strong: rgba(255,255,255,.84); --glass-edge: rgba(255,255,255,.9);
  --line: rgba(27,38,32,.09); --shadow: 0 12px 32px -14px rgba(31,74,52,.32);
  --warn: #9A600E; --crit: #A3402B; --good: #2F7A45; --warn-bg: rgba(154,96,14,.10); --crit-bg: rgba(163,64,43,.10); --good-bg: rgba(47,122,69,.10);
  --blob1: rgba(61,122,78,.20); --blob2: rgba(123,82,54,.14); --scrim: rgba(20,30,24,.30);
  color-scheme: light;
}

html, body { height: 100%; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--f-body); font-size: 15px; line-height: 1.45;
  -webkit-font-smoothing: antialiased; overflow: hidden;
  transition: background-color .6s var(--ease), color .6s var(--ease);
}
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(38% 28% at 12% 8%, var(--blob1), transparent 70%),
    radial-gradient(30% 24% at 92% 30%, var(--blob2), transparent 70%),
    radial-gradient(40% 30% at 70% 96%, var(--blob1), transparent 70%),
    radial-gradient(26% 20% at 6% 70%, var(--blob2), transparent 70%);
}
::selection { background: var(--forest); color: var(--forest-ink); }
* { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--leaf); outline-offset: 2px; border-radius: 10px; }
.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ic.sm { width: 16px; height: 16px; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--f-mono); font-size: 12px; letter-spacing: 0; }

.app { position: relative; z-index: 1; height: 100%; max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; }
.screens {
  flex: 1; overflow-y: auto; overscroll-behavior: contain;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 112px;
}
.view { display: flex; flex-direction: column; gap: 18px; animation: rise .5s var(--ease) both; }
@keyframes rise { from { opacity: .6; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.glass {
  background: var(--glass); border: 1px solid var(--glass-edge);
  -webkit-backdrop-filter: blur(18px) saturate(1.3); backdrop-filter: blur(18px) saturate(1.3);
  box-shadow: var(--shadow);
}
h1 { font-family: var(--f-display); font-weight: 650; font-size: 30px; line-height: 1.05; letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
h2 { font-family: var(--f-display); font-weight: 650; font-size: 19px; letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
h3 { font-size: 15px; font-weight: 600; margin: 0; }
p { margin: 0; }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.section { display: flex; flex-direction: column; gap: 10px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-top: 6px; }
.link { color: var(--leaf); font-weight: 600; font-size: 14px; }

/* top bar */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.title-row { display: flex; align-items: center; gap: 10px; min-width: 0; flex-wrap: wrap; }
.chip-btn {
  display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px 0 14px;
  border-radius: 999px; font-weight: 600; font-size: 14px; max-width: 100%;
}
.chip-btn span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dims { display: flex; gap: 12px; flex-wrap: wrap; color: var(--ink-2); }
.row a.icon-btn .ic { transform: rotate(-90deg); }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-2); flex: none; }

/* sandbox */
.sandbox-row { display: grid; grid-template-columns: minmax(0,1fr) 48px; gap: 10px; align-items: start; }
.stage { min-width: 0; display: flex; justify-content: center; align-items: flex-start; }
.stage svg { display: block; touch-action: none; user-select: none; -webkit-user-select: none; overflow: visible; }
.tools { display: flex; flex-direction: column; gap: 8px; padding: 4px; border-radius: 999px; }
.tool { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-2); position: relative; transition: background-color .2s, color .2s, transform .2s var(--ease); }
.tool:hover { background: var(--line); color: var(--ink); }
.tool:active { transform: scale(.94); }
.tool.primary { background: var(--forest); color: var(--forest-ink); box-shadow: 0 8px 18px -8px var(--forest); }
.tool.primary:hover { background: var(--forest); filter: brightness(1.1); }
.tool[aria-pressed="true"] { color: var(--leaf); background: var(--good-bg); }
.tool:disabled { opacity: .35; cursor: default; }
.tool .badge { position: absolute; top: 2px; right: 1px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--crit); color: var(--paper); font-size: 10px; font-weight: 600; display: grid; place-items: center; }

.pl { cursor: grab; }
.pl:active { cursor: grabbing; }
.pl ellipse.body { fill-opacity: var(--plant-fill); transition: fill-opacity .2s; }
.pl:hover ellipse.body { fill-opacity: calc(var(--plant-fill) + .1); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 14px; border-radius: 50%; flex: none; display: grid; place-items: center; font-style: normal; font-size: 10px; font-weight: 700; color: var(--paper); }
.legend .lg-issue { background: var(--warn); }
.legend .lg-sel { border: 2px solid var(--ink); }
.legend .lg-good { width: 16px; height: 0; border-radius: 0; border-top: 2px dotted var(--good); }

/* tutorial */
.tour { position: absolute; z-index: 50; inset: 0; display: grid; place-items: end center; padding: 16px max(12px, env(safe-area-inset-right, 0px)) 16px max(12px, env(safe-area-inset-left, 0px)); background: var(--scrim); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.tour-card { width: 100%; border-radius: 28px; padding: 22px 20px 18px; background: var(--glass-strong); display: flex; flex-direction: column; gap: 14px; animation: rise .5s var(--ease) both; }
.tour-visual { height: 150px; border-radius: 20px; background: var(--paper-2); display: grid; place-items: center; overflow: hidden; }
.tour-card h2 { font-size: 24px; }
.tour-card p { color: var(--ink-2); }
.dots { display: flex; gap: 6px; }
.dots i { width: 6px; height: 6px; border-radius: 3px; background: var(--line); transition: width .3s var(--ease), background-color .3s; }
.dots i.on { width: 20px; background: var(--forest); }
.tour-nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.tour-nav .btn.primary { flex: none; padding: 0 22px; }

/* sow this month */
.sow { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 8px; margin: 0 -2px; scroll-snap-type: x mandatory; }
.sow button { scroll-snap-align: start; display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px 0 12px; border-radius: 999px; white-space: nowrap; font-weight: 600; font-size: 14px; }

/* weather day buttons */
button.fday { width: 100%; }
button.fday:hover { background: var(--line); }
.fday .tag { font-size: 10.5px; font-weight: 700; color: var(--warn); letter-spacing: .02em; }

/* plus */
.plus { border-radius: var(--r-lg); padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.plus .price { display: flex; align-items: baseline; gap: 8px; font-family: var(--f-display); }
.plus .price b { font-size: 26px; font-weight: 650; }
.plus .price s { color: var(--ink-3); font-size: 16px; }
.pill.plusp { background: color-mix(in srgb, var(--soil) 18%, transparent); color: var(--soil); }
.pl text { font-family: var(--f-body); font-weight: 600; fill: var(--ink); paint-order: stroke; stroke: var(--bed); stroke-linejoin: round; pointer-events: none; }
.ruler { font-family: var(--f-mono); fill: var(--ink-3); }
.dragging .issue-layer { opacity: 0; }
.issue-layer { transition: opacity .2s; pointer-events: none; }
.sel-ring { stroke: var(--ink); fill: none; }

/* stats strip */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); border-radius: var(--r-md); overflow: hidden; }
.stat { padding: 12px 12px 11px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat + .stat { border-left: 1px solid var(--line); }
.stat .label { font-size: 12px; color: var(--ink-2); display: flex; align-items: center; gap: 5px; }
.stat .value { font-family: var(--f-display); font-weight: 650; font-size: 22px; line-height: 1.1; }
.stat .sub { font-size: 12px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat.water .value { letter-spacing: .18em; color: var(--ink-3); }
button.stat { text-align: left; }
button.stat:hover { background: var(--line); }

.reminder { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: var(--r-md); }
.reminder .bell { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--good-bg); color: var(--leaf); flex: none; }
.reminder p { flex: 1; min-width: 0; font-size: 14px; }

/* lists */
.panel { border-radius: var(--r-lg); padding: 6px; }
.row { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 14px; min-width: 0; }
.row + .row { border-top: 1px solid var(--line); border-radius: 0 0 14px 14px; }
.row .grow { flex: 1; min-width: 0; }
.row .grow p { font-size: 13px; color: var(--ink-2); }
.check {
  width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--ink-3); display: grid; place-items: center; flex: none;
  color: transparent; transition: background-color .25s var(--ease), border-color .25s, color .25s;
}
.check[aria-checked="true"] { background: var(--leaf); border-color: var(--leaf); color: var(--paper); }
.task-done h3 { text-decoration: line-through; text-decoration-color: var(--ink-3); color: var(--ink-3); }
.swatch { width: 12px; height: 12px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 22%, transparent); flex: none; }

.pill { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill.crit { background: var(--crit-bg); color: var(--crit); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.good { background: var(--good-bg); color: var(--good); }
.pill.plain { background: var(--line); color: var(--ink-2); }

/* home */
.greet { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.greet p { margin-top: 6px; }
.streak { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: var(--r-lg); }
.streak .flame { width: 42px; height: 42px; border-radius: 50%; background: color-mix(in srgb, var(--soil) 16%, transparent); color: var(--soil); display: grid; place-items: center; flex: none; }
.weeks { display: flex; gap: 6px; margin-top: 8px; }
.weeks i { width: 100%; max-width: 22px; height: 6px; border-radius: 3px; background: var(--line); }
.weeks i.on { background: var(--leaf); }
.weeks i.now { background: linear-gradient(90deg, var(--leaf) 60%, var(--line) 60%); }
.spaces { display: grid; grid-auto-flow: column; grid-auto-columns: 168px; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 2px 2px 14px; margin: 0 -2px; }
.space-card { scroll-snap-align: start; border-radius: var(--r-lg); padding: 12px; display: flex; flex-direction: column; gap: 10px; text-align: left; }
.space-card .thumb { height: 110px; display: grid; place-items: center; }
.space-card h3 { font-size: 14px; }
.space-card .meta { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.tip { display: flex; gap: 12px; padding: 14px 16px; border-radius: var(--r-lg); }
.tip .ic { color: var(--leaf); margin-top: 2px; }
.tip p { font-size: 14px; }

/* harvest timeline */
.tl { display: flex; flex-direction: column; gap: 4px; }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin-top: 6px; }
.bar > i { display: block; height: 100%; border-radius: 3px; background: var(--leaf); }
.bar > i.ready { background: var(--soil); }

/* profile */
.me { display: flex; align-items: center; gap: 14px; }
.avatar { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: var(--forest); color: var(--forest-ink); flex: none; }
.avatar .ic { width: 30px; height: 30px; }
.level { margin-top: 8px; }
.level .bar { height: 8px; }
.trio { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); border-radius: var(--r-lg); overflow: hidden; }
.trio div { padding: 14px; display: flex; flex-direction: column; gap: 2px; }
.trio div + div { border-left: 1px solid var(--line); }
.trio b { font-family: var(--f-display); font-weight: 650; font-size: 24px; line-height: 1; }
.trio span { font-size: 12px; color: var(--ink-2); }
.ach { display: flex; gap: 12px; align-items: center; }
.ach .medal { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; background: var(--good-bg); color: var(--leaf); flex: none; }
.ach.locked .medal { background: var(--line); color: var(--ink-3); }
.ach.locked h3 { color: var(--ink-2); }
.herb { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
@media (min-width: 420px) { .herb { grid-template-columns: repeat(3, minmax(0,1fr)); } }
.herb button { border-radius: var(--r-md); padding: 12px; text-align: left; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.herb .leafmark { width: 34px; height: 34px; border-radius: 12px; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 18%, transparent); color: var(--c); }
.herb h3 { font-size: 14px; }
.herb .sci { font-size: 12px; }
.herb .undisc { opacity: .5; border-style: dashed; box-shadow: none; }
.sci { font-style: italic; color: var(--ink-2); }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); padding: 4px; border-radius: 999px; gap: 4px; }
.seg button { height: 36px; border-radius: 999px; font-weight: 600; font-size: 14px; color: var(--ink-2); display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.seg button[aria-pressed="true"] { background: var(--forest); color: var(--forest-ink); }
.seg button:disabled { opacity: .5; cursor: default; }
.setting { display: flex; flex-direction: column; gap: 8px; padding: 12px 10px; }
.setting + .setting { border-top: 1px solid var(--line); }
.setting .between { display: flex; justify-content: space-between; align-items: center; gap: 10px; }

/* nav */
.nav {
  position: absolute; z-index: 20; bottom: 12px;
  left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: repeat(4, 1fr); padding: 6px; border-radius: 26px;
  background: var(--glass-strong);
}
.nav a { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 7px 0 6px; border-radius: 20px; color: var(--ink-3); text-decoration: none; font-size: 11.5px; font-weight: 600; transition: color .25s, background-color .25s; }
.nav a[aria-current="page"] { color: var(--forest); background: var(--good-bg); }
.nav a:hover { color: var(--ink); }

/* sheet */
.scrim { position: absolute; inset: 0; z-index: 30; background: var(--scrim); opacity: 0; transition: opacity .3s; }
.scrim.show { opacity: 1; }
.sheet {
  position: absolute; z-index: 31; left: 0; right: 0; bottom: 0; max-height: 84%;
  display: flex; flex-direction: column;
  border-radius: 26px 26px 0 0; background: var(--glass-strong);
  -webkit-backdrop-filter: blur(28px) saturate(1.4); backdrop-filter: blur(28px) saturate(1.4);
  border: 1px solid var(--glass-edge); border-bottom: 0; box-shadow: 0 -18px 40px -20px rgba(0,0,0,.35);
  transform: translateY(105%); transition: transform .42s var(--ease); visibility: hidden;
}
.sheet.open { transform: none; visibility: visible; }
.sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 8px auto 0; flex: none; }
.sheet-body { overflow-y: auto; padding: 10px max(18px, env(safe-area-inset-right, 0px)) 22px max(18px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 16px; }
.sh-head { display: flex; align-items: flex-start; gap: 12px; }
.sh-head .grow { flex: 1; min-width: 0; }
.sh-head .swatch { margin-top: 8px; }
.facts { display: flex; flex-wrap: wrap; gap: 6px; }
.fact { display: inline-flex; align-items: center; gap: 5px; height: 30px; padding: 0 10px; border-radius: 999px; background: var(--line); font-size: 13px; color: var(--ink-2); }
.slider { display: grid; grid-template-columns: 64px 1fr 62px; align-items: center; gap: 10px; }
.slider label { font-size: 13px; color: var(--ink-2); }
.slider output { text-align: right; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 28px; background: transparent; accent-color: var(--forest); }
input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: var(--line); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: var(--forest); border: 3px solid var(--paper); margin-top: -9px; box-shadow: 0 2px 6px rgba(0,0,0,.25); }
input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--line); }
input[type=range]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: var(--forest); border: 3px solid var(--paper); }
.issues { display: flex; flex-direction: column; gap: 8px; }
.issue { display: flex; gap: 10px; padding: 10px 12px; border-radius: 14px; font-size: 14px; }
.issue.crit { background: var(--crit-bg); } .issue.crit > .ic { color: var(--crit); }
.issue.warn { background: var(--warn-bg); } .issue.warn > .ic { color: var(--warn); }
.issue.good { background: var(--good-bg); } .issue.good > .ic { color: var(--good); }
.issue .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.issue small { font-size: 12px; color: var(--ink-2); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { height: 44px; padding: 0 16px; border-radius: 999px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: var(--line); }
.btn:hover { filter: brightness(.97); }
.btn.primary { background: var(--forest); color: var(--forest-ink); flex: 1; }
.btn.danger { color: var(--crit); background: var(--crit-bg); }
.search { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; border-radius: 999px; background: var(--line); }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; }
.search input::placeholder { color: var(--ink-3); }
.cat-row { width: 100%; text-align: left; }
.cat-row:hover { background: var(--line); }
.form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field.full { grid-column: 1 / -1; }
.field label { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.field input { height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--paper); padding: 0 12px; outline: 0; width: 100%; }
.field input:focus { border-color: var(--leaf); }
.field .hint { font-size: 12px; color: var(--ink-3); }
.err { color: var(--crit); font-size: 13px; }
.radio-row { width: 100%; text-align: left; }
.radio-row[aria-checked="true"] { background: var(--good-bg); }
.radio-dot { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--ink-3); display: grid; place-items: center; flex: none; }
.radio-row[aria-checked="true"] .radio-dot { border-color: var(--leaf); }
.radio-row[aria-checked="true"] .radio-dot::after { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--leaf); }

.toast {
  position: absolute; z-index: 40; left: 50%; top: 14px; transform: translate(-50%, -140%);
  display: flex; align-items: center; gap: 12px; padding: 8px 8px 8px 16px; border-radius: 999px;
  background: var(--ink); color: var(--paper); font-size: 14px; font-weight: 500; max-width: calc(100% - 32px);
  transition: transform .4s var(--ease); box-shadow: var(--shadow);
}
.toast.show { transform: translate(-50%, 0); }
.toast button { height: 32px; padding: 0 12px; border-radius: 999px; background: color-mix(in srgb, var(--paper) 16%, transparent); font-weight: 600; }
.toast button[hidden] { display: none; }
.emo { font-family: "Noto Color Emoji", "Apple Color Emoji", "Segoe UI Emoji", sans-serif; font-style: normal; line-height: 1; }
.pemo { width: 38px; height: 38px; border-radius: 13px; display: grid; place-items: center; font-size: 21px; background: color-mix(in srgb, var(--c) 16%, transparent); flex: none; }
.pemo.sm { width: 30px; height: 30px; border-radius: 10px; font-size: 17px; }
.pl text.emo { stroke: none; }

/* weather */
.forecast { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 4px; }
.fday { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 2px; border-radius: 14px; text-align: center; }
.fday.alert { background: var(--warn-bg); }
.fday b { font-size: 13px; font-weight: 600; }
.fday .ic { color: var(--ink-2); }
.fday.alert .ic { color: var(--warn); }
.fday span { font-size: 12px; color: var(--ink-2); }
.prec .emos { display: flex; gap: 2px; font-size: 16px; }
.note { font-size: 12px; color: var(--ink-3); padding: 2px 10px 8px; }

/* sun study */
.slots { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }
.slot { position: relative; aspect-ratio: 3 / 4; max-width: 100%; border-radius: 14px; border: 1.5px dashed var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; overflow: hidden; color: var(--ink-2); cursor: pointer; text-align: center; padding: 6px; }
.slot:hover { border-color: var(--leaf); color: var(--leaf); }
.slot.done { border-style: solid; border-color: var(--leaf); }
.slot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.slot .t { position: relative; z-index: 1; font-family: var(--f-mono); font-size: 13px; font-weight: 500; }
.slot.done .t { background: var(--glass-strong); padding: 2px 8px; border-radius: 999px; color: var(--ink); }
.slot input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.slot:focus-within { outline: 2px solid var(--leaf); outline-offset: 2px; }
.switch { position: relative; width: 46px; height: 28px; border-radius: 14px; background: var(--line); flex: none; transition: background-color .2s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--paper); box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .25s var(--ease); }
.switch[aria-checked="true"] { background: var(--leaf); }
.switch[aria-checked="true"]::after { transform: translateX(18px); }
select.input { height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--paper); padding: 0 10px; width: 100%; }

/* tiered achievements */
.tier { position: relative; }
.tier .num-badge { position: absolute; right: -4px; bottom: -4px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px; background: var(--forest); color: var(--forest-ink); font-size: 10px; font-weight: 700; display: grid; place-items: center; font-family: var(--f-mono); }
.ach .bar { height: 5px; }
.reward { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--soil); font-weight: 600; margin-top: 6px; }
.plan { display: flex; gap: 12px; align-items: center; padding: 14px 16px; border-radius: var(--r-lg); }
.plan .ic { color: var(--soil); }

.example { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-3); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}

      s += `<g class="pl" data-uid="${p.uid}" transform="translate(${p.x} ${p.y})"${mini ? "" : ` tabindex="0" role="button" aria-label="${esc(c.name)}, ${p.sx} por ${p.sy} cm${p.pot ? `, en maceta de ${p.pot} cm` : ""}${flag ? ", necesita atención" : ""}"`}>`;
      if (p.pot) { // terracotta pot seen from above: soft drop shadow, rim, inner lip, soil
        const R = p.pot / 2, rim = Math.max(3 * px, Math.min(p.pot * 0.09, 6 * px));
        s += `<circle cy="${2 * px}" r="${R + px}" fill="#000" fill-opacity=".16"/>`;
        s += `<circle r="${R - rim / 2}" fill="var(--pot-soil)" stroke="var(--pot)" stroke-width="${rim}"/>`;
        if (!mini) s += `<circle r="${Math.max(R - rim - 0.8 * px, px)}" fill="none" stroke="var(--pot)" stroke-opacity=".45" stroke-width="${0.8 * px}"/>`;
      }
      s += `<ellipse class="body" rx="${p.sx / 2}" ry="${p.sy / 2}" fill="${c.color}" fill-opacity=".24" stroke="${c.color}" stroke-width="${(mini ? 1 : 1.5) * px}"/>`;
      if (!mini) {
        if (selected === p.uid) s += `<ellipse class="sel-ring" rx="${p.sx / 2 + 5 * px}" ry="${p.sy / 2 + 5 * px}" stroke-width="${2 * px}"/>`;
        s += `<circle r="${Math.max(2.5 * px, Math.min(p.sx, p.sy) * 0.07)}" fill="${c.color}"/>`;
        const wpx = Math.min(p.sx, p.sy) * scale;
        if (wpx >= 30) {
          const label = c.name.length > 11 && wpx < 80 ? c.name.split(" ")[0] : c.name;
          s += `<text y="${Math.min(p.sy / 2 - 5 * px, 16 * px)}" font-size="${10.5 * px}" stroke-width="${3 * px}" text-anchor="middle">${esc(label)}${p.count ? ` ×${p.count}` : ""}</text>`;
        }
        if (flag) { // attention badge on the upper-right edge of the canopy
          const bx = (p.sx / 2) * 0.72, by = -(p.sy / 2) * 0.72;
          s += `<g transform="translate(${bx} ${by})"><circle r="${7 * px}" fill="var(--${flag})" stroke="var(--bed)" stroke-width="${1.5 * px}"/><path d="M0 ${-3.6 * px}V${0.8 * px}M0 ${3.2 * px}v${0.1 * px}" stroke="var(--paper)" stroke-width="${1.8 * px}" stroke-linecap="round"/></g>`;
        }
      }
      s += `</g>`;
    }
    s += `</svg>`;
    return s;
  }

  function stageScale(space, stage) {
    const aw = stage.clientWidth || 300;
    const ah = Math.max(240, Math.min(window.innerHeight * 0.5, 520));
    return Math.min((aw - 30) / space.w, (ah - 26) / space.l);
  }

  function drawSandbox(space) {
    const stage = $("#stage");
    if (!stage) return;
    const scale = stageScale(space, stage);
    stage.innerHTML = sandboxSVG(space, scale);
    stage._scale = scale;
    bindSandbox(space, stage.querySelector("svg"));
  }

  function bindSandbox(space, svg) {
    let drag = null;
    const toCm = (e) => { const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; return pt.matrixTransform(svg.getScreenCTM().inverse()); };
    svg.addEventListener("pointerdown", (e) => {
      const g = e.target.closest(".pl"); if (!g) return;
      const p = space.plants.find((q) => q.uid === g.dataset.uid); if (!p) return;
      const at = toCm(e);
      drag = { g, p, dx: at.x - p.x, dy: at.y - p.y, sx: e.clientX, sy: e.clientY, moved: false, nx: p.x, ny: p.y };
      g.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    svg.addEventListener("pointermove", (e) => {
      if (!drag) return;
      if (!drag.moved && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 4) return;
      if (!drag.moved) { drag.moved = true; svg.classList.add("dragging"); }
      const at = toCm(e);
      const { p } = drag;
      drag.nx = clamp(snap(at.x - drag.dx, space.cell), Math.min(p.sx / 2, space.w / 2), Math.max(space.w - p.sx / 2, space.w / 2));
      drag.ny = clamp(snap(at.y - drag.dy, space.cell), Math.min(p.sy / 2, space.l / 2), Math.max(space.l - p.sy / 2, space.l / 2));
      drag.g.setAttribute("transform", `translate(${drag.nx} ${drag.ny})`);
    });
    const end = () => {
      if (!drag) return;
      const d = drag; drag = null;
      if (d.moved) {
        if (d.nx !== d.p.x || d.ny !== d.p.y) { pushHistory(space); d.p.x = d.nx; d.p.y = d.ny; save(); }
        drawSpace(space.kind, { keepSheet: true });
        if (selected === d.p.uid) refreshPlantIssues(space);
      } else {
        openPlant(space, d.p.uid);
      }
    };
    svg.addEventListener("pointerup", end);
    svg.addEventListener("pointercancel", end);
    svg.addEventListener("keydown", (e) => {
      const g = e.target.closest(".pl"); if (!g) return;
      const p = space.plants.find((q) => q.uid === g.dataset.uid);
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openPlant(space, p.uid); return; }
      const mv = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
      if (!mv) return;
      e.preventDefault();
      pushHistory(space);
      p.x = clamp(p.x + mv[0] * space.cell, p.sx / 2, space.w - p.sx / 2);
      p.y = clamp(p.y + mv[1] * space.cell, p.sy / 2, space.l - p.sy / 2);
      save(); drawSpace(space.kind, { keepSheet: true });
      const again = document.querySelector(`.pl[data-uid="${p.uid}"]`); if (again) again.focus();
    });
  }

  /* ---------- Views ---------- */
  const view = $("#view");
  const ROUTES = ["home", "garden", "harvest", "profile"];
  const route = () => { const h = location.hash.replace("#", ""); return ROUTES.includes(h) ? h : "home"; };

  function render() {
    const r = route();
    selected = null; closeSheet(true);
    document.querySelectorAll(".nav a").forEach((a) => { if (a.dataset.view === r) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
    view.style.animation = "none"; void view.offsetWidth; view.style.animation = "";
    if (r === "home") renderHome();
    else if (r === "profile") renderProfile();
    else renderSpace(r);

  }

  function greeting() { const h = new Date().getHours(); return h < 12 ? "Buen día" : h < 19 ? "Buenas tardes" : "Buenas noches"; }

  function harvestRows() {
    const rows = [];
    for (const sp of state.spaces.filter((s) => s.kind === "harvest")) {
      const seen = {};
      for (const p of sp.plants) {
        const c = CATALOG[p.pid];
        if (!c.days || !p.planted || seen[p.pid]) continue;
        seen[p.pid] = true;
        const age = Math.round((today.getTime() - p.planted) / DAY);
        const left = c.days[0] - age;
        rows.push({ sp, p, c, age, left, pct: clamp(age / c.days[0], 0, 1) });
      }
    }
    return rows.sort((a, b) => a.left - b.left);
  }

  function tasks() {
    const t = [];
    const bed = spaceById("bed");
    if (bed) t.push({ id: "water-bed", title: irrigationOf(bed) === "goteo" ? "Revisá el goteo del cantero" : "Regá el cantero con manguera",
      meta: `Tomates y lechugas · ${irrigationOf(bed) === "goteo" ? "que no haya goteros tapados" : "antes de las 10"}`, go: "harvest", space: "bed" });
    for (const sp of state.spaces) {
      const iss = computeIssues(sp).filter((i) => i.type === "Invasora");
      if (iss.length) { t.push({ id: "inv-" + sp.id, title: "Revisá los estolones de la menta", meta: `${sp.name} · se está expandiendo hacia sus vecinas`, go: sp.kind, space: sp.id }); break; }
    }
    const soon = harvestRows().find((r) => r.left > 0 && r.left <= 14);
    if (soon) t.push({ id: "soon-" + soon.p.pid, title: `${soon.c.name}: list${gx(soon.p.pid)} en ${soon.left} días`, meta: `${soon.sp.name} · planificá la cosecha`, go: "harvest", space: soon.sp.id });
    t.push({ id: "feed-tomato", title: "Aboná los tomates", meta: `${bed ? bed.name : "Cantero elevado"} · cada 14 días`, go: "harvest", space: "bed" });
    const key = today.toISOString().slice(0, 10);
    return t.map((x) => ({ ...x, done: !!(state.tasksDone[key] || {})[x.id], key }));
  }

              <div><h3>${esc(sp.name)}</h3><div class="meta"><span class="mono faint">${fmtM(sp.w)} × ${fmtM(sp.l)} m</span>${n ? `<span class="pill warn">${n}</span>` : `<span class="pill good">${icon("check", "sm")}</span>`}</div></div>
            </a>`;
          }).join("")}
        </div>
      </section>

      <section class="section" aria-labelledby="sow-h">
        <div class="section-head"><h2 id="sow-h">Sembrá en ${today.toLocaleDateString("es-AR", { month: "long" })}</h2><span class="faint" style="font-size:13px">Hemisferio ${hemi() === "south" ? "Sur" : "Norte"}</span></div>
        <div class="sow">
          ${sowNow().map((k) => `<button class="glass" data-act="sow" data-name="${esc(CATALOG[k].name)}"><span class="swatch" style="--c:${CATALOG[k].color}"></span>${CATALOG[k].name}</button>`).join("")}
        </div>
      </section>

      <section class="section" aria-labelledby="wx-h">
        <div class="section-head"><h2 id="wx-h">Clima</h2><span class="example">Pronóstico de ejemplo</span></div>
        <div class="panel glass">
          <div class="forecast">
            ${FORECAST.map((f) => `<button class="fday ${f.alert ? "alert" : ""}" data-act="day" data-d="${f.d}" aria-label="${cap(dayLong(f.d))}: ${f.sum}, máxima ${f.hi} y mínima ${f.lo} grados${f.alert ? `, ${alertTitle(f.alert).toLowerCase()}` : ""}"><b>${f.d === 0 ? "Hoy" : dayShort(f.d)}</b>${icon(f.ic)}<span class="num">${f.hi}° / ${f.lo}°</span>${f.alert ? `<span class="tag">${f.alert}</span>` : `<span class="num">${f.rain ? `${f.rain} mm` : "Seco"}</span>`}</button>`).join("")}
          </div>
          ${precautions().map((p) => `
            <div class="row prec ${state.precDone[p.id] ? "task-done" : ""}">
              <button class="check" role="checkbox" aria-checked="${!!state.precDone[p.id]}" aria-label="Marcar “${esc(p.title)}” como hecha" data-act="prec" data-id="${p.id}">${icon("check", "sm")}</button>
              <div class="grow"><h3>${esc(p.title)}</h3><p>${esc(p.text)}</p>${p.pids.length ? `<div class="facts" style="margin-top:8px">${p.pids.map((x) => `<span class="pill" style="background:color-mix(in srgb, ${CATALOG[x].color} 16%, transparent);color:var(--ink)"><span class="swatch" style="--c:${CATALOG[x].color};width:8px;height:8px"></span>${CATALOG[x].name}</span>`).join("")}</div>` : ""}</div>
            </div>`).join("")}
        </div>
      </section>`;
  }

  const dayShort = (d) => cap(new Date(today.getTime() + d * DAY).toLocaleDateString("es-AR", { weekday: "short" }).replace(".", ""));
  const weekday = (d) => new Date(today.getTime() + d * DAY).toLocaleDateString("es-AR", { weekday: "long" });
  const dayLong = (d) => d === 0 ? "hoy" : d === 1 ? "mañana" : weekday(d);
  const onDay = (d) => d === 0 ? "hoy" : d === 1 ? "mañana" : `el ${weekday(d)}`;
  const beforeDay = (d) => d === 0 ? "hoy mismo" : d === 1 ? "antes de mañana" : `antes del ${weekday(d)}`;
  const nightOf = (d) => d === 0 ? "esta noche" : d === 1 ? "mañana a la noche" : `el ${weekday(d)} a la noche`;
  const alertTitle = (a) => `Alerta de ${a === "Zonda" ? "Zonda" : a.toLowerCase()}`;
  function plantsWith(trait) {
    const ids = new Set();
    state.spaces.forEach((s) => s.plants.forEach((p) => { if (CATALOG[p.pid].traits.includes(trait)) ids.add(p.pid); }));
    return [...ids];
  }
  const ALERT_WHY = {
    Granizo: "Está en ámbar porque hay chance de tormenta con granizo, que en pocos minutos rompe hojas, flores y frutos.",
    Zonda: "Está en ámbar porque se espera viento Zonda, caliente y muy seco, que deshidrata las plantas en pocas horas.",
    Helada: "Está en ámbar porque la mínima baja a 2 °C o menos, y las plantas sensibles al frío pueden morir en una noche.",
    Lluvia: "Está en ámbar porque se esperan más de 20 mm de lluvia: los frutos bajos se pueden pudrir y las macetas, inundar.",
    Calor: "Está en ámbar porque pasa los 32 °C: los cultivos de hoja se pueden espigar y las hojas blandas, quemar.",
  };
  function openDay(d) {
    const f = FORECAST.find((x) => x.d === d); if (!f) return;
    const precs = precautions().filter((p) => p.d === d);
    openSheet(`
      <div class="sh-head"><span class="pemo" style="--c:var(--leaf)">${icon(f.ic)}</span><div class="grow"><h2>${cap(dayLong(f.d))}</h2><p class="muted">${f.sum}</p></div><button class="icon-btn" data-act="close" aria-label="Cerrar">${icon("x")}</button></div>
      <div class="trio glass">
        <div><b class="num">${f.hi}°</b><span>Máxima</span></div>
        <div><b class="num">${f.lo}°</b><span>Mínima</span></div>
        <div><b class="num">${f.rain ? f.rain : 0}</b><span>mm de lluvia · ${f.chance}%</span></div>
      </div>
      ${f.alert ? `<div class="issue warn">${icon("alert")}<div class="grow"><b>${alertTitle(f.alert)}</b><span>${ALERT_WHY[f.alert] || ""}</span></div></div>` : ""}
      ${precs.length ? `<div class="section"><h3>Qué hacer</h3><div class="issues">${precs.map((p) => `<div class="issue good">${icon("sprout")}<div class="grow"><b>${esc(p.title)}</b><span>${esc(p.text)}</span></div></div>`).join("")}</div></div>` : `<p class="muted">Ese día tus plantas no necesitan nada especial.</p>`}
      ${f.d >= 3 ? `<p class="faint" style="font-size:12px">Los pronósticos a tantos días cambian seguido. Saphi los vuelve a revisar todas las mañanas.</p>` : ""}`);
  }

  function precautions() {
    const out = [];
    const rain = FORECAST.find((f) => f.rain >= 20), heat = FORECAST.find((f) => f.hi >= 32), frost = FORECAST.find((f) => f.lo <= 2);
    const hail = FORECAST.find((f) => f.hail), zonda = FORECAST.find((f) => f.zonda);
    if (hail) {
      // every crop in a harvest space, plus soft-leaved ornamentals
      const ids = new Set();
      state.spaces.forEach((s) => s.plants.forEach((p) => { if (s.kind === "harvest" || CATALOG[p.pid].traits.includes("softLeaf")) ids.add(p.pid); }));
      if (ids.size) out.push({ id: "hail-" + hail.d, pids: [...ids], d: hail.d,
        title: `Cubrí la huerta y las plantas delicadas con tela antigranizo o media sombra ${beforeDay(hail.d)}`,
        text: `${hail.chance}% de probabilidad de tormenta con granizo. Las hojas tiernas y los frutos se rompen con el golpe.` });
    }
    if (zonda) {
      const potted = new Set();
      state.spaces.forEach((s) => s.plants.forEach((p) => { if (p.pot) potted.add(p.pid); }));
      out.push({ id: "zonda-" + zonda.d, pids: [...potted], d: zonda.d,
        title: "Regá temprano y protegé del viento caliente las plantas jóvenes y las que están en maceta",
        text: `Zonda ${onDay(zonda.d)}, con hasta ${zonda.hi} °C y aire muy seco. La tierra de las macetas se seca en pocas horas.` });
    }
    if (rain) {
      const low = plantsWith("lowFruit");
      if (low.length) out.push({ id: "rain-fruit-" + rain.d, pids: low, d: rain.d, title: `Levantá los frutos del suelo ${beforeDay(rain.d)}`,
        text: `Se esperan ${rain.rain} mm de lluvia. Los morrones, tomates y frutillas apoyados en tierra mojada se pueden pudrir. Poné paja abajo o atá las ramas bajas.` });
    }
    // Only when the week brings meaningful rain; it never tells the user to stop watering
    const total = FORECAST.reduce((a, f) => a + f.rain, 0);
    if (total >= 20) {
      const wettest = FORECAST.reduce((a, f) => (f.rain > a.rain ? f : a), FORECAST[0]);
      out.push({ id: "rain-water-" + wettest.d, pids: [], d: wettest.d, title: "Regá menos esta semana",
        text: `Se esperan unos ${total} mm de lluvia. Antes de regar, tocá la tierra: si está húmeda a 2 cm, esperá un día. Fijate que las macetas drenen bien.` });
    }
    if (heat) {
      const hs = plantsWith("heatBolt");
      if (hs.length) out.push({ id: "heat-" + heat.d, pids: hs, d: heat.d, title: `Protegé del calor ${onDay(heat.d)}`,
        text: `Se esperan ${heat.hi} °C. La lechuga se puede espigar y las hojas de la hortensia, quemar. Regá temprano y poné media sombra a la tarde.` });
    }
    if (frost) {
      const ft = plantsWith("frostTender");
      if (ft.length) out.push({ id: "frost-" + frost.d, pids: ft, d: frost.d, title: `Tapá las plantas sensibles ${nightOf(frost.d)}`,
        text: `Se esperan ${frost.lo} °C. Cubrilas con tela antiheladas antes de que baje el sol.` });
    }
    return out;
  }

  function renderSpace(kind) {
    const space = currentSpace(kind);
    const title = kind === "garden" ? "Jardín" : "Cosecha";
    if (!space) {
      view.innerHTML = `<header class="topbar"><h1>${title}</h1></header><div class="panel glass" style="padding:20px"><p class="muted">Todavía no tenés espacios.</p><button class="btn primary" data-act="space-new" data-kind="${kind}" style="margin-top:12px">${icon("plus")} Crear un espacio</button></div>`;
