        <div class="tools glass" role="toolbar" aria-label="Herramientas del plano">
          <button class="tool primary" data-act="add" aria-label="Agregar una planta">${icon("plus")}</button>
          <button class="tool" data-act="sun" aria-label="Sol y sombras" aria-pressed="${state.showShadows}" id="sun-btn">${icon("sun")}</button>
          <button class="tool" data-act="toggle-issues" aria-pressed="${state.showIssues}" aria-label="Mostrar los problemas de las plantas" id="issues-btn">${icon("eye")}</button>
          <button class="tool" data-act="undo" aria-label="Deshacer el último cambio" id="undo-btn">${icon("undo")}</button>
        </div>
      </div>
      <div class="legend" aria-label="Referencias del plano">
        <span>${potGlyph()}En maceta</span>
        <span><i class="lg-issue">!</i>Necesita atención, tocala</span>
        <span><i class="lg-good"></i>Buena pareja</span>
        <span><i class="lg-sel"></i>Seleccionada</span>
      </div>
      <div id="space-info"></div>
      ${kind === "harvest" ? `<section class="section" aria-labelledby="tl-h"><div class="section-head"><h2 id="tl-h">Calendario de cosecha</h2></div><div class="panel glass tl" id="timeline"></div></section>` : ""}`;
    drawSpace(kind);
    if (pendingSearch && kind === "harvest") {
      const q = pendingSearch; pendingSearch = null;
      openCatalog(space);
      const inp = $("#cat-search"); inp.value = q; inp.dispatchEvent(new Event("input"));
    }
  }

  function drawSpace(kind, o = {}) {
    if (route() !== kind) return;
    const space = currentSpace(kind);
    drawSandbox(space);
    const issues = computeIssues(space);
    const n = problemCount(issues);
    const fs = freeSoil(space);
    const t = tasks().find((x) => x.space === space.id && !x.done);
    const dims = $("#dims");
    if (dims) {
      const wa = waterAvg(space), ph = soilPH();
      dims.innerHTML = `<span>${fmtM(space.w)} × ${fmtM(space.l)} m</span><span>${fmt1(space.w * space.l / 1e4)} m²</span>${space.depth ? `<span>${space.depth} cm de profundidad</span>` : ""}<span>cuadrícula de ${space.cell} cm</span>${wa != null ? `<span>Agua ${fmt1(wa)}/10</span>` : ""}${ph ? `<span>pH probable ${dec(ph)} · ejemplo</span>` : ""}<span>Riego: ${irrigationOf(space) === "goteo" ? "goteo" : "manguera"}</span>`;
    }
    const info = $("#space-info");
    info.innerHTML = `
      <div class="stats glass">
        <div class="stat"><span class="label">Suelo libre</span><span class="value num">${fs.pct}%</span><span class="sub num">${fmt1(fs.m2)} m² libres</span></div>
        <div class="stat water"><span class="label">${icon("drop", "sm")} Humedad</span><span class="value" aria-label="Sin datos">– – –</span><span class="sub">Conectá un sensor</span></div>
        <button class="stat" data-act="issues"><span class="label">${icon("alert", "sm")} Problemas</span><span class="value num" style="color:${n ? "var(--warn)" : "var(--good)"}">${n}</span><span class="sub">${n ? "Tocá para revisar" : "Vecinos perfectos"}</span></button>
      </div>
      ${t ? `<div class="reminder glass" style="margin-top:10px"><span class="bell">${icon("bell", "sm")}</span><p><b>${esc(t.title)}</b><br><span class="muted">${esc(t.meta)}</span></p></div>` : ""}`;
    const ib = $("#issues-btn");
    if (ib) { ib.setAttribute("aria-pressed", state.showIssues); ib.innerHTML = icon("eye") + (n && !state.showIssues ? `<span class="badge">${n}</span>` : ""); }
    const sb = $("#sun-btn"); if (sb) sb.setAttribute("aria-pressed", state.showShadows);
    const ub = $("#undo-btn"); if (ub) ub.disabled = !(history[space.id] && history[space.id].length);
    const tl = $("#timeline");
    if (tl) {
      const rows = harvestRows().filter((r) => r.sp.id === space.id);
      tl.innerHTML = rows.length ? rows.map((r) => `
        <div class="row">${emo(r.p.pid, "sm")}
          <div class="grow"><div style="display:flex;justify-content:space-between;gap:8px"><h3>${r.c.name}</h3><span class="mono ${r.left <= 0 ? "" : "faint"}" style="${r.left <= 0 ? "color:var(--soil);font-weight:500" : ""}">${r.left <= 0 ? `List${gx(r.p.pid)}` : `${r.left} días`}</span></div>
          <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(r.pct * 100)}" aria-label="Crecimiento de ${the(r.p.pid)}"><i class="${r.left <= 0 ? "ready" : ""}" style="width:${Math.round(r.pct * 100)}%"></i></div>
          <p class="mono faint" style="margin-top:4px">Día ${r.age} de ${r.c.days[0]}–${r.c.days[1]}</p></div></div>`).join("")
        : `<p class="muted" style="padding:12px">Agregá cultivos con fecha de siembra para ver cuándo están listos.</p>`;
    }
    if (!o.keepSheet && selected) refreshPlantIssues(space);
  }

  /* ---------- Profile ---------- */
  const LEVELS = [[0, "Plantín"], [60, "Brote"], [140, "Cultivador"], [240, "Jardinero"], [380, "Paisajista"], [600, "Maestro jardinero"]];
  function discovered() {
    const ids = new Set(); state.spaces.forEach((s) => s.plants.forEach((p) => ids.add(p.pid)));
    return [...ids];
  }
  function score(ids) {
    const fams = new Set(ids.map((i) => CATALOG[i].family));
    return ids.reduce((a, i) => a + CATALOG[i].rarity * 10, 0) + fams.size * 5;
  }
  function renderProfile() {
    const ids = discovered();
    const pts = score(ids);
    let li = 0; LEVELS.forEach((l, i) => { if (pts >= l[0]) li = i; });
    const next = LEVELS[li + 1];
    const pct = next ? (pts - LEVELS[li][0]) / (next[0] - LEVELS[li][0]) : 1;
    const perfect = state.spaces.filter((s) => s.plants.length >= 3 && problemCount(computeIssues(s)) === 0).length;
    const pollMax = Math.max(0, ...state.spaces.map((s) => new Set(s.plants.filter((p) => CATALOG[p.pid].pollinator).map((p) => p.pid)).size));
    const photosTaken = Object.values(state.sunStudy).reduce((a, s) => a + Object.keys(s || {}).length, 0);
    const precTaken = Object.values(state.precDone).filter(Boolean).length;
    const ROMAN = ["", "I", "II", "III"];
    const chains = [
      { ic: "leaf", name: "Coleccionista", unit: "especies plantadas", v: ids.length, tiers: [5, 15, 30], reward: "10% de descuento en un sensor de suelo" },
      { ic: "flame", name: "Constancia", unit: "semanas seguidas", v: 6, tiers: [4, 12, 26], reward: "1 mes de Saphi Plus" },
      { ic: "shield", name: "Buenos vecinos", unit: "espacios sin problemas", v: perfect, tiers: [1, 3, 5], plus: true },
      { ic: "flower", name: "Amigo de los polinizadores", unit: "especies polinizadoras en un espacio", v: pollMax, tiers: [3, 5, 8] },
      { ic: "sun", name: "Lector de sol", unit: "fotos del estudio de sol", v: photosTaken, tiers: [1, 3, 9], plus: true },
      { ic: "cloud", name: "Previsor del clima", unit: "precauciones de clima tomadas", v: precTaken, tiers: [1, 10, 25], plus: true },
      { ic: "basket", name: "Cosechador", unit: "cosechas registradas", v: 0, tiers: [1, 10, 50], reward: "20% de descuento en el kit de riego" },
    ].map((c) => ({ ...c, tier: c.tiers.filter((t) => c.v >= t).length }));
    const earned = chains.reduce((a, c) => a + c.tier, 0);
    const all = Object.keys(CATALOG);
    const rar = (r) => r >= 8 ? `<span class="pill crit">Rara</span>` : r >= 3 ? `<span class="pill warn">Poco común</span>` : `<span class="pill plain">Común</span>`;
    view.innerHTML = `
      <header class="me">
        <div class="avatar">${icon("sprout")}</div>
        <div style="flex:1;min-width:0">
          <h1>${LEVELS[li][1]}</h1>
          <p class="muted">Nivel ${li + 1}${next ? ` · te faltan ${next[0] - pts} puntos para ${next[1]}` : ""}</p>
          <div class="level bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(pct * 100)}" aria-label="Progreso de nivel"><i style="width:${Math.round(pct * 100)}%"></i></div>
        </div>
      </header>

      <div class="trio glass">
        <div><b class="num">${ids.length}</b><span>Especies</span></div>
        <div><b class="num">${pts}</b><span>Biodiversidad</span></div>
        <div><b class="num">6</b><span>Semanas seguidas</span></div>
      </div>

      <section class="plus glass" aria-labelledby="plus-h">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2 id="plus-h">Saphi Plus</h2><span class="pill good">Gratis durante la beta</span></div>
        <p class="muted" style="font-size:14px">Espacios ilimitados, análisis del estudio de sol y alertas de clima. Los logros Plus te descuentan 20% del mes siguiente, de forma automática.</p>
        <div class="row" style="padding:10px 0 0;border-top:1px solid var(--line);border-radius:0">
          <div class="grow"><h3>Próximo mes, después de la beta</h3><p>${(() => { const e = chains.find((c) => c.plus && c.tier); return e ? `Ganaste ${e.name} ${ROMAN[e.tier]} este mes` : "Ganá un logro Plus para tener 20% de descuento"; })()}</p></div>
          <div class="price">${chains.some((c) => c.plus && c.tier) ? `<s>US$5</s><b class="num">US$4</b>` : `<b class="num">US$5</b>`}</div>
        </div>
        <span class="example">Precio de ejemplo</span>
      </section>

      <section class="section" aria-labelledby="ach-h">
        <div class="section-head"><h2 id="ach-h">Logros</h2><span class="faint num">${earned}/${chains.length * 3} niveles</span></div>
        <div class="panel glass">
          ${chains.map((c) => {
            const next = c.tiers[c.tier];
            const prev = c.tier ? c.tiers[c.tier - 1] : 0;
            const pct = next ? clamp((c.v - prev) / (next - prev), 0, 1) : 1;
            return `<div class="row ach ${c.tier ? "" : "locked"}">
              <span class="medal tier">${icon(c.tier ? c.ic : "lock")}${c.tier ? `<span class="num-badge">${ROMAN[c.tier]}</span>` : ""}</span>
              <div class="grow">
                <div style="display:flex;justify-content:space-between;gap:8px"><h3 style="display:flex;gap:6px;align-items:center">${c.name}${c.tier ? ` ${ROMAN[c.tier]}` : ""}${c.plus ? `<span class="pill plusp">Plus</span>` : ""}</h3><span class="mono faint num">${next ? `${c.v}/${next}` : "Listo"}</span></div>
                <p>${next ? `Te faltan ${next - c.v} ${c.unit} para el nivel ${ROMAN[c.tier + 1]}` : `Todos los niveles completos · ${c.v} ${c.unit}`}</p>
                <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(pct * 100)}" aria-label="Progreso de ${c.name}"><i style="width:${Math.round(pct * 100)}%"></i></div>
                ${c.plus ? `<span class="reward">${icon("basket", "sm")}Cada nivel nuevo: 20% de descuento en tu próximo mes de Plus</span>` : c.reward ? `<span class="reward">${icon("basket", "sm")}Premio del nivel III: ${c.reward}</span>` : ""}
              </div>
            </div>`;
          }).join("")}
        </div>
        <p class="faint" style="font-size:12px">Los premios están pensados para después de la beta y acá se muestran como ejemplo.</p>
      </section>

      <section class="section" aria-labelledby="herb-h">
        <div class="section-head"><h2 id="herb-h">Colección de plantas</h2><span class="faint num">${ids.length}/${all.length}</span></div>
        <p class="muted" style="font-size:14px">Cada especie que plantás se suma a tu colección. Las especies raras suman más puntos de biodiversidad.</p>
        <div class="herb">
          ${all.sort((a, b) => (ids.includes(b) - ids.includes(a)) || CATALOG[b].rarity - CATALOG[a].rarity).map((pid) => {
            const c = CATALOG[pid], has = ids.includes(pid);
            return `<button class="glass ${has ? "" : "undisc"}" data-act="herb" data-pid="${pid}" style="--c:${c.color}">
<span class="leafmark">${icon(has ? (c.kind === "harvest" ? "sprout" : "leaf") : "lock")}</span>
              <div><h3>${has ? c.name : "Sin descubrir"}</h3><p class="sci">${has ? c.sci : c.family}</p></div>
              <div class="facts" style="gap:4px">${has ? rar(c.rarity) : `<span class="pill plain">${c.rarity * 10} pts</span>`}${c.native ? `<span class="pill good">Nativa</span>` : ""}</div>
            </button>`;
          }).join("")}
        </div>
      </section>

      <section class="section" aria-labelledby="set-h">
        <div class="section-head"><h2 id="set-h">Ajustes</h2></div>
        <div class="panel glass">
          <div class="setting">
            <div class="between"><h3>Tema</h3><span class="faint" style="font-size:13px">${state.mode === "auto" ? `Ahora ${resolvedMode() === "day" ? "de día" : "de noche"}, según tu hora local` : ""}</span></div>
            <div class="seg glass" role="group" aria-label="Tema">
              ${[["auto", "Automático", "auto"], ["day", "Día", "sun"], ["night", "Noche", "moon"]].map(([v, l, ic]) => `<button data-act="mode" data-mode="${v}" aria-pressed="${state.mode === v}">${icon(ic, "sm")}${l}</button>`).join("")}
            </div>
          </div>
          <div class="setting">
            <div class="between"><h3>Ubicación</h3><span class="faint" style="font-size:13px">Para el sol, la sombra y el clima</span></div>
            <p class="muted" style="font-size:14px">${locSummary()}</p>
            ${locationHTML()}
          </div>
          <div class="setting">
            <div class="between"><h3>Hemisferio</h3><span class="faint" style="font-size:13px">${state.location ? "Lo define tu ubicación" : "Si preferís no compartir tu ubicación"}</span></div>
            <div class="seg glass" role="group" aria-label="Hemisferio" style="grid-template-columns:1fr 1fr">
              ${[["south", "Sur"], ["north", "Norte"]].map(([v, l]) => `<button data-act="hemi" data-v="${v}" aria-pressed="${hemi() === v}" ${state.location ? "disabled" : ""}>${l}</button>`).join("")}
            </div>
          </div>
          <div class="setting"><div class="between"><h3>Unidades</h3><span class="muted">Métrico (cm, m)</span></div></div>
          <div class="setting"><div class="between"><h3>Cómo funciona Saphi</h3><button class="btn" data-act="tour-open">Ver el tutorial</button></div></div>
          <div class="setting"><div class="between"><h3>Tus datos</h3><span class="muted" style="font-size:13px;text-align:right">En el prototipo quedan en este dispositivo</span></div>
            <button class="btn danger" data-act="reset" style="align-self:flex-start">Restablecer datos de ejemplo</button></div>
        </div>
      </section>`;
  }

  /* ---------- Sheet ---------- */
  const sheet = $("#sheet"), sheetBody = $("#sheet-body"), scrim = $("#scrim");
  let onSheetClose = null, lastFocus = null;
  function openSheet(html, onClose) {
    sheetKind = null;
    if (!sheet.classList.contains("open")) lastFocus = document.activeElement;
    sheetBody.innerHTML = html;
    scrim.hidden = false; requestAnimationFrame(() => scrim.classList.add("show"));
    sheet.classList.add("open"); sheet.setAttribute("aria-hidden", "false");
    onSheetClose = onClose || null;
    sheetBody.scrollTop = 0;
    setTimeout(() => { const f = sheetBody.querySelector("[autofocus], input, button"); if (f) f.focus({ preventScroll: true }); }, 60);
  }
  function closeSheet(silent) {
    if (!sheet.classList.contains("open")) return;
    sheet.classList.remove("open"); sheet.setAttribute("aria-hidden", "true");
    scrim.classList.remove("show"); setTimeout(() => { if (!sheet.classList.contains("open")) scrim.hidden = true; }, 300);
    const cb = onSheetClose; onSheetClose = null;
    if (cb && !silent) cb();
    if (lastFocus && document.contains(lastFocus) && !silent) lastFocus.focus({ preventScroll: true });
  }
  scrim.addEventListener("click", () => closeSheet());
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });

  const SUN = { full: "Sol pleno", partial: "Media sombra", shade: "Sombra" };
  // Plant facts shared by the plant sheet and the collection sheet
  const factsHTML = (c) => `<span class="fact">${icon("sun", "sm")}${SUN[c.sun]}</span><span class="fact">${icon("drop", "sm")}Agua ${c.water}/10</span><span class="fact mono">pH ${dec(c.ph[0])}–${dec(c.ph[1])}</span><span class="fact">${c.life}</span>${c.native ? `<span class="fact" style="color:var(--good);background:var(--good-bg)">Nativa</span>` : ""}${c.invasive ? `<span class="fact" style="color:var(--crit)">Se expande</span>` : ""}${c.invasiveAR ? `<span class="fact" style="color:var(--crit);background:var(--crit-bg)">Invasora en Argentina</span>` : ""}`;

  function issueHTML(it, space, withJump) {
    const ic = it.sev === "good" ? "sprout" : "alert";
    const fixP = it.fix && space ? space.plants.find((p) => p.uid === it.fix) : null;
    return `<div class="issue ${it.sev}">${icon(ic)}<div class="grow"><div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center"><b>${it.type}</b><span class="pill plain">${it.conf}</span></div><span>${esc(it.text)}</span><div class="actions" style="gap:14px">${fixP ? `<button class="link" data-act="pot-on" data-uid="${it.fix}" style="display:inline-flex;align-items:center;gap:6px">${potGlyph()}Poner ${esc(the(fixP.pid))} en maceta</button>` : ""}${withJump ? `<button class="link" data-act="jump" data-uid="${it.a}">Ver en el plano</button>` : ""}</div></div></div>`;
  }

  const potGlyph = () => `<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" style="flex:none"><circle cx="8" cy="8.6" r="6.3" fill="#000" fill-opacity=".16"/><circle cx="8" cy="8" r="5.6" fill="var(--pot-soil)" stroke="var(--pot)" stroke-width="2"/></svg>`;
  const defaultPot = (p) => clamp(Math.round((Math.min(p.sx, p.sy) * 0.6) / 5) * 5, 20, 80);
  function setPot(space, uid, on) {
    const p = space.plants.find((q) => q.uid === uid); if (!p) return;
    if (!!p.pot === on) return;
    pushHistory(space);
    if (on) p.pot = defaultPot(p); else delete p.pot;
    save(); drawSpace(space.kind, { keepSheet: true });
    toast(on ? `${The(p.pid)} pasó a una maceta de ${p.pot} cm` : `${The(p.pid)} volvió a la tierra`);
  }

  function openPlant(space, uid) {
    selected = uid;
    drawSpace(space.kind, { keepSheet: true });
    const p = space.plants.find((q) => q.uid === uid); if (!p) return;
    const c = CATALOG[p.pid];
    const sl = (key, label, min, max) => `<div class="slider"><label for="sl-${key}">${label}</label><input type="range" id="sl-${key}" min="${min}" max="${max}" step="5" value="${p[key]}" data-key="${key}"><output class="mono num" id="out-${key}">${p[key]} cm</output></div>`;
    openSheet(`
      <div class="sh-head">${c.kind === "harvest" ? emo(p.pid) : `<span class="swatch" style="--c:${c.color}"></span>`}<div class="grow"><h2>${c.name}${p.count ? ` <span class="faint mono">×${p.count}</span>` : ""}</h2><p class="sci">${c.sci}</p></div><button class="icon-btn" data-act="close" aria-label="Cerrar">${icon("x")}</button></div>
      <div class="facts">${factsHTML(c)}</div>
      <div class="section"><div class="section-head" style="margin:0"><h3>Tamaño adulto</h3><span class="faint" style="font-size:12px">Catálogo: ${c.sx} × ${c.sy} × ${c.h} cm</span></div>
        ${sl("sx", "Ancho", 10, Math.max(400, c.sx * 2))}${sl("sy", "Largo", 10, Math.max(400, c.sy * 2))}${sl("h", "Alto", 10, Math.max(500, c.h * 2))}
      </div>
      <div class="section">
        <h3>Dónde está plantada</h3>
        <div class="seg glass" role="group" aria-label="Dónde está plantada" style="grid-template-columns:1fr 1fr">
          <button data-act="pot-mode" data-v="ground" aria-pressed="${!p.pot}">En la tierra</button>
          <button data-act="pot-mode" data-v="pot" aria-pressed="${!!p.pot}">${potGlyph()}En maceta</button>
        </div>
        ${p.pot ? `${sl("pot", "Maceta Ø", 15, 120)}<p class="muted" style="font-size:13px">La maceta separa raíces y tierra: no se escapan estolones y tiene su propio pH. ${p.pot < Math.min(p.sx, p.sy) * 0.4 ? `<b style="color:var(--warn)">Esta maceta parece chica para una planta de ${p.sx} cm.</b>` : ""}</p>` : ""}
      </div>
      <div class="section"><h3>Vecinos y suelo</h3><div class="issues" id="plant-issues"></div></div>
      <div class="actions">
        <button class="btn" data-act="dup">${icon("copy", "sm")}Duplicar</button>
        <button class="btn danger" data-act="remove">${icon("trash", "sm")}Quitar</button>
        <button class="btn primary" data-act="close">Listo</button>
      </div>`, () => { selected = null; drawSpace(space.kind, { keepSheet: true }); });
    refreshPlantIssues(space);
    sheetBody.querySelectorAll("input[type=range]").forEach((inp) => {
      let pushed = false;
      inp.addEventListener("input", () => {
        if (!pushed) { pushHistory(space); pushed = true; }
        const v = +inp.value; p[inp.dataset.key] = v;
        if (inp.dataset.key !== "h") { p.x = clamp(p.x, Math.min(p.sx / 2, space.w / 2), Math.max(space.w - p.sx / 2, space.w / 2)); p.y = clamp(p.y, Math.min(p.sy / 2, space.l / 2), Math.max(space.l - p.sy / 2, space.l / 2)); }
        $("#out-" + inp.dataset.key).textContent = v + " cm";
        drawSpace(space.kind, { keepSheet: true }); refreshPlantIssues(space);
      });
      inp.addEventListener("change", () => { pushed = false; save(); });
    });
  }
  function refreshPlantIssues(space) {
    const box = $("#plant-issues"); if (!box || !selected) return;
    const mine = computeIssues(space).filter((i) => i.a === selected || i.b === selected);
    box.innerHTML = mine.length ? mine.map((i) => issueHTML(i, space)).join("") : `<div class="issue good">${icon("check")}<div class="grow"><b>Sin conflictos</b><span>Esta planta tiene lugar, luz y tierra compatible a su alrededor.</span></div></div>`;
  }

  function openCatalog(space) {
    const list = (q) => Object.entries(CATALOG)
      .filter(([, c]) => c.kind === space.kind && (!q || (c.name + " " + c.sci).toLowerCase().includes(q.toLowerCase())))
      .map(([id, c]) => `<button class="row cat-row" data-act="place" data-pid="${id}"><span class="swatch" style="--c:${c.color}"></span><div class="grow"><h3>${c.name}${c.native ? ` <span class="pill good">Nativa</span>` : ""}${c.invasiveAR ? ` <span class="pill crit">Invasora</span>` : ""}</h3><p class="mono">Ø ${c.sx === c.sy ? c.sx : `${c.sx}×${c.sy}`} cm · ${c.h} cm de alto</p></div><span class="fact" style="height:26px">${icon(c.sun === "full" ? "sun" : "leaf", "sm")}${c.sun === "full" ? "Sol" : "Sombra"}</span></button>`).join("")
      || `<p class="muted" style="padding:12px">Ninguna planta coincide. Probá con el nombre común o el científico.</p>`;
    openSheet(`
      <div class="sh-head"><div class="grow"><h2>Agregar una planta</h2><p class="muted">En ${esc(space.name)}. Los tamaños son de planta adulta.</p></div><button class="icon-btn" data-act="close" aria-label="Cerrar">${icon("x")}</button></div>
      <label class="search">${icon("search", "sm")}<input id="cat-search" type="search" placeholder="Buscá ${space.kind === "garden" ? "ornamentales" : "cultivos"}" aria-label="Buscar plantas" autocomplete="off"></label>
      <div class="panel" id="cat-list" style="padding:0">${list("")}</div>`);
    $("#cat-search").addEventListener("input", (e) => { $("#cat-list").innerHTML = list(e.target.value.trim()); });
  }

  function openIssues(space) {
    const iss = computeIssues(space);
    const probs = iss.filter((i) => i.sev !== "good"), goods = iss.filter((i) => i.sev === "good");
    openSheet(`
      <div class="sh-head"><div class="grow"><h2>${probs.length ? `${probs.length} ${probs.length === 1 ? "problema" : "problemas"} en ${esc(space.name)}` : "Vecinos perfectos"}</h2><p class="muted">Espacio, sombra, suelo y plantas invasoras.</p></div><button class="icon-btn" data-act="close" aria-label="Cerrar">${icon("x")}</button></div>
      <div class="issues">${probs.sort((a, b) => (a.sev === "crit" ? 0 : 1) - (b.sev === "crit" ? 0 : 1)).map((i) => issueHTML(i, space, true)).join("") || `<div class="issue good">${icon("check")}<div class="grow"><b>Nada para arreglar</b><span>Cada planta tiene lugar, luz y tierra compatible.</span></div></div>`}</div>
      ${goods.length ? `<div class="section"><h3>Buenas parejas</h3><div class="issues">${goods.map((i) => issueHTML(i, space, false)).join("")}</div></div>` : ""}
      <p class="faint" style="font-size:12px" data-kind="issues">Medido: calculado con el tamaño de las plantas. Documentado: respaldado por fuentes de horticultura. Tradicional: consejo común de jardinería, con menos evidencia. Estimado: calculado con la altura de la planta y la dirección del sol, o con datos de suelo de ejemplo.</p>`);
    sheetKind = { type: "issues" };
  }

  function locationHTML() {
    const loc = state.location;
    return `<div class="field"><label for="loc-city">Ciudad</label>
        <select class="input" id="loc-city"><option value="">${loc ? "Cambiar ciudad" : "Elegí una ciudad"}</option>${CITIES.map(([n]) => `<option value="${esc(n)}" ${loc && loc.name === n ? "selected" : ""}>${esc(n)}</option>`).join("")}</select></div>
      <div class="actions"><button class="btn" data-act="loc-gps">${icon("sun", "sm")}Usar mi ubicación actual</button>${loc ? `<button class="btn" data-act="loc-clear">Quitar ubicación</button>` : ""}</div>`;
  }
  const locSummary = () => {
    const lat = latitude();
    return state.location
      ? `${esc(state.location.name)} · ${fmt1(Math.abs(lat))}° ${lat < 0 ? "S" : "N"}`
      : `Sin ubicación. Usamos el Hemisferio ${hemi() === "south" ? "Sur" : "Norte"} a ${fmt1(Math.abs(lat))}°.`;
  };

  let sheetKind = null;
  function openSun(space) {
    const study = (state.sunStudy[space.id] = state.sunStudy[space.id] || {});
    const ph = photos[space.id] || {};
    const SLOTS = [["s8", "08:00", "Mañana"], ["s13", "13:00", "Mediodía"], ["s19", "19:00", "Tarde"]];
    const taken = SLOTS.filter(([k]) => study[k]).length;
    const soil = soilPH();
    openSheet(`
      <div class="sh-head"><div class="grow"><h2>Sol y sombras</h2><p class="muted">${esc(space.name)}</p></div><button class="icon-btn" data-act="close" aria-label="Cerrar">${icon("x")}</button></div>
      <div class="panel glass">
        <div class="row"><div class="grow"><h3>Ubicación</h3><p>${locSummary()}</p></div></div>
        ${soil ? `<div class="row"><div class="grow"><h3>Suelo</h3><p class="mono">pH probable ${dec(soil)} · ejemplo</p></div></div>` : ""}
        <div class="row"><div class="grow"><h3>Sol del mediodía ${seasonLabel()}</h3><p class="mono">${Math.round(noonElevation())}° sobre el horizonte · una planta de 1 m da ${shadowLen(100)} cm de sombra</p></div></div>
      </div>
      ${state.location ? "" : `<div class="section">${locationHTML()}</div>`}
      <div class="seg glass" role="group" aria-label="Estación">
        ${[["today", "Hoy"], ["winter", "Pleno invierno"], ["summer", "Pleno verano"]].map(([v, l]) => `<button data-act="season" data-v="${v}" aria-pressed="${state.season === v}">${l}</button>`).join("")}
      </div>
      <div class="between" style="display:flex;justify-content:space-between;align-items:center;gap:12px">
        <div><h3>Mostrar sombras del mediodía</h3><p class="muted" style="font-size:13px">Los avisos de sombra usan la misma estación.</p></div>
        <button class="switch" role="switch" aria-checked="${state.showShadows}" data-act="shadows" aria-label="Mostrar sombras del mediodía"></button>
      </div>
      <div class="section">
        <div class="section-head" style="margin:0"><h3>Estudio de sol</h3><span class="faint num">${taken}/3 fotos</span></div>
        <p class="muted" style="font-size:14px">Sacá una foto del espacio desde el mismo lugar a estas horas. Saphi marca dónde caen la luz y la sombra en tu cuadrícula. Con una foto a las 13:00 alcanza para empezar.</p>
        <div class="slots">
          ${SLOTS.map(([k, t, l]) => `<label class="slot ${study[k] ? "done" : ""}">
            ${ph[k] ? `<img src="${ph[k]}" alt="Foto de las ${t}">` : study[k] ? "" : icon("plus")}
            <span class="t">${t}</span>${study[k] ? "" : `<span style="font-size:12px">${l}</span>`}
            <input type="file" accept="image/*" capture="environment" data-slot="${k}" aria-label="Agregar foto de las ${t}">
          </label>`).join("")}
        </div>
        <p class="faint" style="font-size:12px">En este prototipo las fotos quedan en tu dispositivo y no se analizan.</p>
      </div>`);
    sheetKind = { type: "sun", space };
    sheetBody.querySelectorAll(".slot input").forEach((inp) => inp.addEventListener("change", () => {
      const f = inp.files && inp.files[0]; if (!f) return;
      (photos[space.id] = photos[space.id] || {})[inp.dataset.slot] = URL.createObjectURL(f);
      study[inp.dataset.slot] = Date.now(); save();
      openSun(space); toast("Foto agregada al estudio de sol");
    }));
  }

  function setLocation(loc) {
    state.location = loc; save();
    if (sheetKind && sheetKind.type === "sun" && sheet.classList.contains("open")) { openSun(sheetKind.space); drawSpace(sheetKind.space.kind, { keepSheet: true }); }
    else render();
    toast(loc ? `Ubicación: ${loc.name}` : "Quitaste la ubicación");
  }
  document.addEventListener("change", (e) => {
    if (e.target.id !== "loc-city" || !e.target.value) return;
    const c = CITIES.find(([n]) => n === e.target.value);
    if (c) setLocation({ name: c[0], lat: c[1] });
  });

  function openSpaces(kind, showForm) {
    const list = state.spaces.filter((s) => s.kind === kind);
    const cur = currentSpace(kind);
    openSheet(`
      <div class="sh-head"><div class="grow"><h2>${kind === "garden" ? "Espacios de jardín" : "Espacios de cosecha"}</h2></div><button class="icon-btn" data-act="close" aria-label="Cerrar">${icon("x")}</button></div>
      <div class="panel glass" role="radiogroup" aria-label="Espacios">
        ${list.map((s) => `<button class="row radio-row" role="radio" aria-checked="${cur && s.id === cur.id}" data-act="pick-space" data-id="${s.id}"><span class="radio-dot"></span><div class="grow"><h3>${esc(s.name)}</h3><p class="mono">${fmtM(s.w)} × ${fmtM(s.l)} m · ${s.plants.length} ${s.plants.length === 1 ? "planta" : "plantas"}</p></div></button>`).join("")}
      </div>
      ${cur && !showForm ? `<div class="section">
        <div class="between" style="display:flex;justify-content:space-between;align-items:baseline;gap:12px"><h3>Riego</h3><span class="faint" style="font-size:13px">${esc(cur.name)}</span></div>
        <div class="seg glass" role="group" aria-label="Riego de ${esc(cur.name)}" style="grid-template-columns:1fr 1fr">
          ${[["manguera", "Manguera"], ["goteo", "Goteo"]].map(([v, l]) => `<button data-act="irrigation" data-v="${v}" aria-pressed="${irrigationOf(cur) === v}">${icon("drop", "sm")}${l}</button>`).join("")}
        </div>
      </div>` : ""}
      <form class="section" id="space-form" novalidate ${showForm ? "" : "hidden"}>
        <h3>Espacio nuevo</h3>
        <div class="form">
          <div class="field full"><label for="f-name">Nombre</label><input id="f-name" maxlength="40" placeholder="Cantero del fondo" required></div>
          <div class="field"><label for="f-w">Ancho (m)</label><input id="f-w" inputmode="decimal" placeholder="3,5"></div>
          <div class="field"><label for="f-l">Largo (m)</label><input id="f-l" inputmode="decimal" placeholder="6"></div>
          <div class="field full"><label for="f-d">Profundidad de tierra (cm, opcional)</label><input id="f-d" inputmode="numeric" placeholder="40"><span class="hint">Sirve para canteros elevados y macetas.</span></div>
        </div>
        <p class="err" id="f-err" role="alert"></p>
        <button class="btn primary" type="submit">Crear espacio</button>
      </form>
      ${showForm ? "" : `<button class="btn" data-act="space-new" data-kind="${kind}">${icon("plus", "sm")}Espacio nuevo</button>`}`);
    const form = $("#space-form");
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const name = $("#f-name").value.trim();
      const num = (v) => parseFloat(String(v).replace(",", "."));
      const w = num($("#f-w").value), l = num($("#f-l").value), dRaw = $("#f-d").value.trim(), d = dRaw ? num(dRaw) : null;
      const err = $("#f-err");
      if (!name) { err.textContent = "Ponele un nombre al espacio, como “Frente de casa”."; $("#f-name").focus(); return; }
      if (!(w >= 0.3 && w <= 100) || !(l >= 0.3 && l <= 100)) { err.textContent = "El ancho y el largo tienen que estar entre 0,3 y 100 metros."; return; }
      if (dRaw && !(d > 0 && d <= 300)) { err.textContent = "La profundidad tiene que estar entre 1 y 300 cm, o quedar vacía."; return; }
      const W = Math.round(w * 100), L = Math.round(l * 100);
      const cell = W * L > 400000 ? 25 : 10;
      const sp = { id: "s" + Date.now().toString(36), kind, name, w: W, l: L, depth: d ? Math.round(d) : null, cell, irrigation: "manguera", plants: [] };
      state.spaces.push(sp); state.current[kind] = sp.id; save();
      closeSheet(true); renderSpace(kind); toast(`Creaste “${name}”. Agregá tu primera planta.`);
    });
  }

  /* ---------- Toast ---------- */
  let toastT;
  function toast(msg, action) {
    const el = $("#toast"), btn = $("#toast-act");
    $("#toast-msg").textContent = msg;
    btn.hidden = !action; btn.onclick = action ? () => { action(); el.classList.remove("show"); } : null;
    el.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("show"), action ? 4500 : 2400);
  }

  /* ---------- Actions ---------- */
  document.addEventListener("click", (e) => {
    const link = e.target.closest("a[data-space]");
    if (link) { const sp = spaceById(link.dataset.space); if (sp) { state.current[sp.kind] = sp.id; save(); } }
    const b = e.target.closest("[data-act]"); if (!b) return;
    const act = b.dataset.act;
    const r = route();
    const space = (r === "garden" || r === "harvest") ? currentSpace(r) : null;
    switch (act) {
      case "close": closeSheet(); break;
      case "add": openCatalog(space); break;
      case "place": {
        const c = CATALOG[b.dataset.pid];
        const spot = findFreeSpot(space, c.sx, c.sy);
        pushHistory(space);
        const p = P(b.dataset.pid, spot.x, spot.y, 0);
        space.plants.push(p); save();
        closeSheet(true); openPlant(space, p.uid);
        toast(spot.ok ? `Agregaste ${the(p.pid)}. Arrastral${gx(p.pid)} para mover${gx(p.pid) === "o" ? "lo" : "la"}.` : `No hay un lugar libre para ${the(p.pid)}. Quedó en el centro.`);
        break;
      }
      case "sun": openSun(space); break;
      case "day": openDay(+b.dataset.d); break;
      case "sow": pendingSearch = b.dataset.name; state.current.harvest = state.current.harvest || "bed"; save();
        if (route() === "harvest") { render(); } else location.hash = "harvest"; break;
      case "tour-next": tourStep++; drawTour(); break;
      case "tour-back": tourStep = Math.max(0, tourStep - 1); drawTour(); break;
      case "tour-end": endTour(); break;
      case "tour-open": tourStep = 0; drawTour(); break;
      case "pot-mode": setPot(space, selected, b.dataset.v === "pot"); openPlant(space, selected); break;
      case "pot-on": {
        const kind = sheetKind && sheetKind.type;
        setPot(space, b.dataset.uid, true);
        if (kind === "issues") openIssues(space); else if (selected) openPlant(space, selected);
        break;
      }
      case "season": state.season = b.dataset.v; save(); drawSpace(r, { keepSheet: true }); openSun(space); break;
      case "shadows": state.showShadows = !state.showShadows; save(); drawSpace(r, { keepSheet: true }); openSun(space); break;
      case "loc-clear": setLocation(null); break;
      case "loc-gps": {
        const fail = () => toast("Acá la ubicación está bloqueada. Elegí una ciudad.");
        try {
          if (!navigator.geolocation) { fail(); break; }
          navigator.geolocation.getCurrentPosition(
            (pos) => { const { latitude: la, longitude: lo } = pos.coords; setLocation({ name: `Ubicación actual (${fmt1(la)}°; ${fmt1(lo)}°)`, lat: la }); },
            fail, { timeout: 8000, maximumAge: 600000 });
        } catch (err) { fail(); }
        break;
      }
      case "prec": {
        state.precDone[b.dataset.id] = !state.precDone[b.dataset.id]; save(); renderHome();
        const again = document.querySelector(`[data-act="prec"][data-id="${b.dataset.id}"]`); if (again) again.focus({ preventScroll: true });
        break;
      }
      case "toggle-issues": state.showIssues = !state.showIssues; save(); drawSpace(r, { keepSheet: true }); break;
      case "undo": undo(space); break;
      case "issues": openIssues(space); break;
      case "jump": closeSheet(true); openPlant(space, b.dataset.uid); break;
      case "dup": {
        const p = space.plants.find((q) => q.uid === selected); if (!p) break;
        const spot = findFreeSpot(space, p.sx, p.sy);
        pushHistory(space);
        const n = { ...p, uid: "p" + (++uidN) + Math.random().toString(36).slice(2, 6), x: spot.x, y: spot.y };
        space.plants.push(n); save(); closeSheet(true); openPlant(space, n.uid); toast(`Duplicaste ${the(p.pid)}`);
        break;
      }
      case "remove": {
        const p = space.plants.find((q) => q.uid === selected); if (!p) break;
        pushHistory(space);
        space.plants = space.plants.filter((q) => q.uid !== p.uid); selected = null; save();
        closeSheet(true); drawSpace(r);
        toast(`Quitaste ${the(p.pid)}`, () => undo(space));
        break;
      }
      case "spaces": openSpaces(b.dataset.kind, false); break;
      case "irrigation": {
        if (!space) break;
        space.irrigation = b.dataset.v === "goteo" ? "goteo" : "manguera"; save();
        openSpaces(r, false); drawSpace(r, { keepSheet: true });
        toast(space.irrigation === "goteo" ? `${space.name}: riego por goteo` : `${space.name}: riego con manguera`);
        break;
      }
      case "space-new": openSpaces(b.dataset.kind, true); break;
      case "pick-space": state.current[r] = b.dataset.id; save(); closeSheet(true); renderSpace(r); break;
      case "task": {
        const key = today.toISOString().slice(0, 10);
        const day = (state.tasksDone[key] = state.tasksDone[key] || {});
        day[b.dataset.id] = !day[b.dataset.id]; save(); renderHome();
        const again = document.querySelector(`[data-act="task"][data-id="${b.dataset.id}"]`); if (again) again.focus({ preventScroll: true });
        break;
      }
      case "cycle-mode": state.mode = state.mode === "auto" ? (resolvedMode() === "day" ? "night" : "day") : "auto"; save(); applyMode(); renderHome();
        toast(state.mode === "auto" ? "El tema sigue tu hora local" : `Tema de ${state.mode === "day" ? "día" : "noche"} activado`); break;
      case "mode": state.mode = b.dataset.mode; save(); applyMode(); renderProfile(); break;
      case "hemi": state.hemisphere = b.dataset.v; save(); renderProfile(); toast("Avisos de sombra actualizados"); break;
      case "herb": {
        const c = CATALOG[b.dataset.pid]; const ids = discovered();
        if (!ids.includes(b.dataset.pid)) { toast(`Plantá esta especie de la familia ${c.family} para descubrirla`); break; }
        const sp = state.spaces.filter((s) => s.plants.some((p) => p.pid === b.dataset.pid)).map((s) => s.name).join(", ");
        openSheet(`<div class="sh-head">${c.kind === "harvest" ? emo(b.dataset.pid) : `<span class="swatch" style="--c:${c.color}"></span>`}<div class="grow"><h2>${c.name}</h2><p class="sci">${c.sci} · ${c.family}</p></div><button class="icon-btn" data-act="close" aria-label="Cerrar">${icon("x")}</button></div>
          <div class="facts">${factsHTML(c)}</div>
          <div class="panel glass"><div class="row"><div class="grow"><h3>Tamaño adulto</h3><p class="mono">${c.sx} × ${c.sy} cm de ancho · ${c.h} cm de alto</p></div></div><div class="row"><div class="grow"><h3>Crece en</h3><p>${esc(sp)}</p></div></div><div class="row"><div class="grow"><h3>Valor de biodiversidad</h3><p>${c.rarity * 10} puntos</p></div></div></div>`);
        break;
      }
      case "reset": state = Object.assign(EXTRA(), SEED(), { tutorialDone: true }); Object.keys(history).forEach((k) => delete history[k]); save(); applyMode(); render(); toast("Datos de ejemplo restaurados"); break;
    }
  });

  /* ---------- Tutorial ---------- */
  let tourStep = 0;
  const big = (id) => `<span style="width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:var(--forest);color:var(--forest-ink)"><svg class="ic" style="width:34px;height:34px"><use href="#i-${id}"/></svg></span>`;
  const TOUR = [
    { t: "Te damos la bienvenida a Saphi", p: "Planificá tu jardín y tu huerta a escala, mirá qué plantas se llevan bien y mantenelas vivas con recordatorios.", v: () => big("sprout") },
    { t: "Dibujá tu espacio", p: "Poné el ancho y el largo reales. Cada cuadradito mide 10 cm, así que lo que entra en la pantalla entra en tu patio.",
      v: () => { const sp = spaceById("front") || state.spaces[0]; return sp ? sandboxSVG(sp, Math.min(200 / sp.w, 130 / sp.l), { mini: true }) : big("ruler"); } },
    { t: "Agregá y mové plantas", p: "Tocá + para agregar una planta con su tamaño adulto. Arrastrala para moverla. Tocala para cambiar su tamaño o ponerla en maceta.",
      v: () => `<div style="display:flex;align-items:center;gap:18px"><span class="tool primary" style="width:52px;height:52px">${icon("plus")}</span><svg width="150" height="80" viewBox="0 0 150 80" aria-hidden="true"><circle cx="30" cy="40" r="22" fill="#C8553D" fill-opacity=".25" stroke="#C8553D" stroke-width="1.5"/><path d="M56 40h52" stroke="var(--ink-3)" stroke-width="2" stroke-dasharray="4 4"/><path d="M104 34l8 6-8 6" fill="none" stroke="var(--ink-3)" stroke-width="2"/><circle cx="130" cy="40" r="16" fill="var(--pot-soil)" stroke="var(--pot)" stroke-width="5"/></svg></div>` },
    { t: "Leé el plano", p: "Un círculo con ! quiere decir que una planta necesita atención: están muy juntas, les falta sol, no les va el suelo o se expanden. Tocala para ver por qué. Muchos problemas se arreglan con un toque, como pasarla a una maceta.",
      v: () => `<div class="legend" style="flex-direction:column;gap:12px;font-size:14px"><span><i class="lg-issue" style="width:20px;height:20px;font-size:13px">!</i>Necesita atención</span><span>${potGlyph()}En maceta: raíces y tierra aparte</span><span><i class="lg-good"></i>Buena pareja</span></div>` },
    { t: "Sol y clima", p: "Empezamos en Mendoza. Elegí tu ciudad para que Saphi sepa el ángulo del sol, tu sombra, tu suelo y el pronóstico. Podés cambiarla después en Perfil.",
      v: () => `<div style="width:100%;padding:0 16px;display:flex;flex-direction:column;gap:10px">${locationHTML()}</div>` },
    { t: "Crecé y ahorrá", p: "Los logros siguen tu progreso. Con Saphi Plus, algunos te descuentan 20% del mes siguiente, de forma automática.",
      v: () => `<div style="display:flex;gap:10px">${["leaf", "shield", "sun"].map((i, n) => `<span class="medal tier" style="width:54px;height:54px;border-radius:18px;display:grid;place-items:center;background:var(--good-bg);color:var(--leaf);position:relative">${icon(i)}<span class="num-badge">${["I", "II", "III"][n]}</span></span>`).join("")}</div>` },
  ];
  function drawTour() {
    const el = $("#tour");
    if (tourStep >= TOUR.length) { endTour(true); return; }
    const s = TOUR[tourStep], last = tourStep === TOUR.length - 1;
    el.innerHTML = `<div class="tour-card">
      <div class="tour-visual">${s.v()}</div>
      <div class="dots" aria-hidden="true">${TOUR.map((_, i) => `<i class="${i === tourStep ? "on" : ""}"></i>`).join("")}</div>
      <div><h2 id="tour-title">${s.t}</h2><p style="margin-top:6px">${s.p}</p></div>
      <div class="tour-nav">
        ${tourStep ? `<button class="btn" data-act="tour-back">Atrás</button>` : `<button class="btn" data-act="tour-end">Saltar</button>`}
        <span class="faint mono num">${tourStep + 1} / ${TOUR.length}</span>
        <button class="btn primary" data-act="${last ? "tour-end" : "tour-next"}" data-finish="${last}">${last ? "Empezar a planificar" : "Siguiente"}</button>
      </div>
    </div>`;
    el.hidden = false;
    const f = el.querySelector(".btn.primary"); if (f) f.focus({ preventScroll: true });
  }
  function endTour(toGarden) {
    const el = $("#tour"), wasLast = tourStep >= TOUR.length - 1;
    el.hidden = true; el.innerHTML = "";
    state.tutorialDone = true; save();
    if (toGarden || wasLast) { if (route() !== "garden") location.hash = "garden"; else render(); }
  }
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("#tour").hidden) { tourStep = 0; endTour(false); } });

  window.addEventListener("hashchange", render);
  let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { const r = route(); if (r === "garden" || r === "harvest") drawSpace(r, { keepSheet: true }); }, 120); });
  render();
  if (!state.tutorialDone) drawTour();
})();
</script>
